<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulasi Teknik DNA Rekombinan</title>
<style>
*{box-sizing:border-box}h1,h2,p{margin:0}button{font-family:inherit}svg{display:block}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}.gap-1{gap:.25rem}.gap-2{gap:.5rem}.font-extrabold{font-weight:800}.font-bold{font-weight:700}.font-semibold{font-weight:600}.my-2{margin:.5rem 0}.my-3{margin:.75rem 0}.min-w-0{min-width:0}.text-xs{font-size:.75rem}.text-sm{font-size:.875rem}.text-lg{font-size:1.125rem}.text-xl{font-size:1.25rem}.leading-tight{line-height:1.2}.w-full{width:100%}.h-full{height:100%}
.hidden{display:none!important}
@keyframes lys{to{transform:translate(var(--dx),var(--dy))}}@keyframes flow{to{stroke-dashoffset:-18}}@keyframes fillb{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes conv{from{transform:translateX(-90px);opacity:0}to{transform:none;opacity:1}}@keyframes fall{from{transform:translateY(-70px);opacity:0}to{transform:none;opacity:1}}
.lys{animation:lys 2s ease-out forwards;transform-box:fill-box}.flow{stroke-dasharray:10 8;animation:flow .7s linear infinite}.fillb{transform-box:fill-box;transform-origin:bottom;animation:fillb 3.2s ease-in .6s both}.conv{animation:conv .8s both}.fall{animation:fall 1.4s both}
</style>
<style>
:root{--bg:#cfe8ff;--bg2:#9ccbff;--panel:#fff;--soft:#eaf4ff;--line:#8fbdf2;--tx:#0b1f4a;--mut:#46618e;--neon:#0b7fe8;--g1:#1d4ed8;--g2:#06b6d4;--vio:#7c3aed;--pink:#ec4899;--grn:#12b886;--red:#f43f5e;--amb:#ffb020;--org:#ff7a1a;--bd:#6f9bd6;--on:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#040d24;--bg2:#0a2158;--panel:#0b1a3d;--soft:#0a1630;--line:#2a4f86;--tx:#e6f0ff;--mut:#9ab2d2;--neon:#38bdf8;--g1:#2563eb;--g2:#0891b2;--vio:#8b5cf6;--pink:#f472b6;--grn:#34d399;--red:#fb7185;--amb:#fbbf24;--org:#fb923c;--bd:#5b7ba5;--on:#fff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#040d24;--bg2:#0a2158;--panel:#0b1a3d;--soft:#0a1630;--line:#2a4f86;--tx:#e6f0ff;--mut:#9ab2d2;--neon:#38bdf8;--g1:#2563eb;--g2:#0891b2;--vio:#8b5cf6;--pink:#f472b6;--grn:#34d399;--red:#fb7185;--amb:#fbbf24;--org:#fb923c;--bd:#5b7ba5;--on:#fff;color-scheme:dark}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;margin:0}
body{background:radial-gradient(circle at 12% 8%,color-mix(in srgb,var(--g2) 38%,transparent),transparent 42%),radial-gradient(circle at 92% 92%,color-mix(in srgb,var(--vio) 28%,transparent),transparent 48%),linear-gradient(160deg,var(--bg),var(--bg2));color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;touch-action:manipulation;-webkit-user-select:none;user-select:none}

/* ===== Tata letak ===== */
#app{height:100dvh;display:flex;flex-direction:column;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#top{display:flex;align-items:center;gap:8px;margin:5px 8px 6px;padding:4px 8px;border-radius:16px;background:linear-gradient(90deg,var(--g1),var(--g2));box-shadow:0 4px 14px color-mix(in srgb,var(--g1) 40%,transparent)}
.ttl{flex:none;line-height:1.1}
.ttl h1{font-size:15px;font-weight:900;color:#fff;white-space:nowrap;text-shadow:0 2px 6px #0004}
#prog{flex:1;display:flex;gap:4px;min-width:0}
#btns{display:flex;gap:4px;flex:none}
.ib{width:34px;height:34px;border-radius:11px;background:#ffffff30;border:2px solid #ffffff80;color:#fff;font-size:16px;cursor:pointer;padding:0}
.ib:active{transform:scale(.92)}
#main{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;padding:0 8px 7px}
#stage{flex:1 1 0;min-height:0;min-width:0;position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--neon) 28%,transparent) 1px,transparent 0) 0 0/18px 18px,radial-gradient(circle at 50% 0,color-mix(in srgb,var(--g2) 30%,transparent),transparent 60%),linear-gradient(180deg,color-mix(in srgb,var(--neon) 20%,var(--panel)),color-mix(in srgb,var(--g1) 14%,var(--panel)));border:3px solid var(--neon);box-shadow:0 0 0 3px color-mix(in srgb,var(--neon) 18%,transparent),0 8px 24px color-mix(in srgb,var(--g1) 35%,transparent)}
#svg{position:relative;z-index:1}
#panel{display:flex;flex-direction:column;gap:6px;min-height:0;max-height:46dvh;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;padding:1px 2px 4px;scrollbar-width:thin}
#panel>*{flex:none}
#guide .gt{font-size:12.5px}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;font-size:19px;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--neon) 30%,transparent);animation:bob 2.4s infinite}
#tray{touch-action:pan-y}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:7px;padding:2px 2px 6px}
@media (orientation:landscape){
 #main{flex-direction:row}
 #panel{width:clamp(240px,38vw,340px);flex:none;max-height:none}
}

/* ===== Chip progres ===== */
.chip{flex:1;text-align:center;font-size:10.5px;font-weight:800;padding:3px 2px;border-radius:999px;background:#ffffff26;border:2px solid #ffffff55;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.on{background:#fff;border-color:#fff;color:var(--g1)}
.chip.ok{background:linear-gradient(135deg,#10b981,#34d399);border-color:#d1fae5;color:#fff}
.chip.cur{box-shadow:0 0 0 3px #ffffffaa,0 0 12px #fff8}

/* ===== Item seret ===== */
.item{touch-action:none;width:100%;min-height:58px;border-radius:15px;background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--neon) 12%,var(--panel)));border:3px solid var(--amb);box-shadow:0 4px 0 color-mix(in srgb,var(--amb) 60%,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:grab;color:var(--tx);padding:3px;transition:transform .15s}
.item .em{font-size:24px;line-height:1}.item .lb{font-size:10.5px;font-weight:800;text-align:center;line-height:1.1}
.item:active{transform:scale(1.06)}.item.sel{border-color:var(--neon);background:color-mix(in srgb,var(--neon) 20%,var(--panel));animation:wig .6s infinite}
.item.off{opacity:.25;pointer-events:none;box-shadow:none}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;font-size:52px;filter:drop-shadow(0 8px 6px #0006);transform:translate(-50%,-70%)}
.zone{fill:transparent;stroke:var(--bd);stroke-width:2;stroke-dasharray:8 6;opacity:.5}
.dragging .zone,.selmode .zone{stroke:var(--amb);opacity:1;fill:color-mix(in srgb,var(--amb) 16%,transparent);animation:dash .8s linear infinite}
text{fill:var(--tx);font-family:system-ui,sans-serif}.t{font-size:15px;font-weight:700}.mut{fill:var(--mut)}
.hot{cursor:pointer}

/* ===== Kartu panel ===== */
.rc,.mis{background:linear-gradient(180deg,color-mix(in srgb,var(--g2) 12%,var(--panel)),var(--panel));border:3px solid var(--grn);border-radius:16px;padding:.5rem .6rem;width:100%;font-size:13px;box-shadow:0 4px 14px color-mix(in srgb,var(--g1) 22%,transparent)}
.rc .text-sm{font-size:.8rem;line-height:1.35}
.mis{border-color:var(--neon)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;font-weight:900;font-size:13px;color:var(--g1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mh{color:var(--neon)}}
:root[data-theme="dark"] .mh{color:var(--neon)}
.mt{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-size:11px}
.md{font-size:12px;line-height:1.35;margin:.3rem 0 .25rem;font-weight:600}
.ml{list-style:none;padding:0;margin:.2rem 0;display:flex;flex-direction:column;gap:3px}
.ml li{display:flex;gap:6px;align-items:flex-start;font-size:11.5px;line-height:1.3;padding:3px 5px;border-radius:10px;background:var(--soft)}
.ml .bx{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:900;background:var(--line);color:var(--tx)}
.ml .dn{opacity:.8}.ml .dn .bx{background:var(--grn);color:#fff}
.ml .cu{background:color-mix(in srgb,var(--amb) 22%,var(--panel));outline:2px solid var(--amb);animation:glow 1.4s infinite}
.ml .cu .bx{background:var(--amb);color:#1a0a00}
.mp{font-size:11px;color:var(--mut);margin-top:.2rem}

/* ===== Pesan umpan balik (di panel) ===== */
#toast{padding:.4rem .55rem;border-radius:13px;border:2px solid var(--neon);background:var(--panel);font-size:12px;line-height:1.35;max-height:34dvh;overflow:auto;animation:pi .3s;cursor:pointer;box-shadow:0 4px 12px color-mix(in srgb,var(--g1) 25%,transparent)}
#toast.ok{border-color:var(--grn);background:color-mix(in srgb,var(--grn) 14%,var(--panel))}#toast.err{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--panel))}#toast.hint{border-color:var(--amb)}

/* ===== Modal ===== */
.ov{position:fixed;inset:0;z-index:40;background:#020a2399;backdrop-filter:blur(3px);display:grid;place-items:center;padding:10px}
.box{background:linear-gradient(180deg,color-mix(in srgb,var(--g2) 12%,var(--panel)),var(--panel));border:3px solid var(--neon);border-radius:22px;padding:14px;max-width:420px;width:100%;max-height:92dvh;overflow:auto;text-align:center;box-shadow:0 12px 40px #0006,0 0 30px color-mix(in srgb,var(--neon) 35%,transparent);animation:pop .5s both}
.btn{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);border-radius:14px;padding:.65rem 1.1rem;font-weight:900;border:0;cursor:pointer;font-size:1rem;box-shadow:0 4px 0 color-mix(in srgb,var(--g1) 60%,#000);text-shadow:0 1px 2px #0003}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--g1) 60%,#000)}
.btn:disabled{opacity:.35}
.btn.sm{padding:.4rem .7rem;font-size:.8rem;border-radius:12px}
.btn.ghost{background:transparent;border:2px solid var(--neon);color:var(--neon);box-shadow:none;text-shadow:none}
.opt{display:block;width:100%;text-align:left;margin:.3rem 0;padding:.5rem .55rem;border-radius:12px;border:2px solid var(--line);background:var(--soft);color:var(--tx);font-size:.82rem;cursor:pointer}
.opt:active{border-color:var(--neon)}
.intro{max-width:720px}
.intro .col{min-width:0}
@media (orientation:landscape){
 .intro{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;text-align:left;align-items:center}
 .intro svg{max-width:200px!important}
}
.bu{position:fixed;z-index:60;font-size:24px;pointer-events:none;animation:bu .9s forwards}
@keyframes bu{to{transform:translate(var(--dx),var(--dy)) scale(1.4);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-14}}@keyframes wig{50%{transform:rotate(-5deg)}}
@keyframes pi{from{transform:translateY(-8px);opacity:0}}
@keyframes sl{to{transform:translateX(-22px)}}@keyframes sr{to{transform:translateX(22px)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes drp{from{transform:translateY(-80px);opacity:0}to{transform:none;opacity:1}}
@keyframes fl{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes glow{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--amb) 45%,transparent)}}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:300% 0}}
@keyframes rise{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.85}90%{opacity:.85}100%{transform:translate(var(--dx,20px),-115dvh) rotate(40deg);opacity:0}}
@keyframes twist{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
@keyframes grow{to{width:100%}}
@keyframes letter{from{opacity:0;transform:translateY(30px) scale(.4) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes twk{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.2) rotate(20deg)}}
@keyframes barw{from{width:0}to{width:100%}}
.cl{animation:sl .9s forwards}.cr{animation:sr .9s forwards}.pop{animation:pop .6s both;transform-box:fill-box;transform-origin:center}.ins{animation:drp .9s both}.hb{animation:fl 1.2s infinite}.bob{animation:bob 1.4s infinite}

/* ===== Gelembung & melayang ===== */
.bub{position:absolute;bottom:-40px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fffb,color-mix(in srgb,var(--g2) 35%,transparent));border:1px solid #fff7;pointer-events:none;z-index:0;animation:rise linear infinite}
.fl-e{position:absolute;bottom:-50px;pointer-events:none;z-index:1;animation:rise linear infinite}

/* ===== Splash pembuka ===== */
#splash{position:fixed;inset:0;z-index:80;display:grid;place-items:center;overflow:hidden;color:#fff;cursor:pointer;background:radial-gradient(circle at 18% 22%,#38bdf8aa,transparent 45%),radial-gradient(circle at 85% 85%,#7c3aedcc,transparent 50%),linear-gradient(135deg,#0b1f6b,#1d4ed8 55%,#0891b2);transition:opacity .6s,transform .6s}
#splash.out{opacity:0;transform:scale(1.1);pointer-events:none}
.sp-in{position:relative;z-index:2;display:flex;align-items:center;gap:clamp(12px,4vw,34px);padding:12px 18px;max-width:100%}
.helix{height:min(62dvh,300px);width:auto;flex:none;filter:drop-shadow(0 0 12px #22d3eecc);animation:bob 3s ease-in-out infinite}
.rung{transform-box:fill-box;transform-origin:center;animation:twist 3.2s ease-in-out infinite}
.sp-tx{min-width:0}
.sp-k{font-size:12px;font-weight:800;letter-spacing:.25em;color:#bae6fd;animation:fadeup .7s .1s both}
.sp-h{font-size:clamp(26px,7vw,50px);font-weight:900;letter-spacing:.04em;display:flex;flex-wrap:wrap;line-height:1.05;margin:.15rem 0;text-shadow:0 4px 18px #0006}
.sp-h span{display:inline-block;animation:letter .6s cubic-bezier(.2,1.6,.4,1) both}
.sp-sub{font-size:clamp(11px,2.6vw,14px);color:#e0f2fe;animation:fadeup .8s 1.5s both}
.sp-skip{margin-top:.8rem;font-size:11.5px;color:#bae6fd;animation:fadeup .6s 3.6s both}
#spc{position:relative;z-index:2;width:100%;display:grid;place-items:center}
.sp-cr{margin-top:.7rem;font-size:10.5px;letter-spacing:.04em;color:#bae6fd;animation:fadeup .8s 2s both}
.orbit{--r:calc(min(62dvh,250px) * .4);position:relative;flex:none;width:min(62dvh,250px);aspect-ratio:1}
.orbit .ring{position:absolute;inset:6%;border-radius:50%;border:2px dashed #ffffff55;animation:spin 30s linear infinite reverse}
.orbit .ring2{inset:30%;border-color:#22d3ee77}
.orbit .core{position:absolute;inset:0;display:grid;place-items:center}
.orbit .core .helix{height:56%}
.orb{position:absolute;inset:0;animation:spin 16s linear infinite}
.oi{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a)) translateY(calc(var(--r) * -1))}
.oc{transform:rotate(calc(var(--a) * -1));animation:fin .6s both}
.ou{position:absolute;left:-23px;top:-23px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:#ffffff2a;border:2px solid #ffffff88;box-shadow:0 0 14px #22d3ee99;animation:spin 16s linear infinite reverse}
.bm-k{font-size:11px;font-weight:800;letter-spacing:.25em;color:#bae6fd;animation:fadeup .7s .1s both}
.bm-h{font-size:clamp(22px,5.6vw,42px);font-weight:900;line-height:1.05;margin:.2rem 0;text-shadow:0 4px 18px #0006;display:flex;flex-wrap:wrap}
.bm-h span{display:inline-block;animation:letter .6s cubic-bezier(.2,1.6,.4,1) both}
.bm-d{font-size:clamp(11px,2.5vw,13.5px);color:#e0f2fe;max-width:340px;animation:fadeup .8s 1.2s both}
.capt{position:relative;height:32px;margin-top:.7rem}
.capt span{position:absolute;left:0;top:0;white-space:nowrap;font-weight:800;font-size:clamp(13px,3vw,17px);padding:.2rem .75rem;border-radius:999px;background:linear-gradient(90deg,#ffffff38,#ffffff14);border:1px solid #ffffff77;opacity:0;animation:capt 5.5s infinite both}
.pl{display:flex;justify-content:center;align-items:center;gap:6px;margin:.4rem 0;font-size:1.4rem}
.pl span{display:inline-block;animation:pulse 2s infinite}
.pl span:nth-of-type(2){animation-delay:.5s}.pl span:nth-of-type(3){animation-delay:1s}.pl span:nth-of-type(4){animation-delay:1.5s}
.pl i{font-style:normal;font-size:1rem;color:var(--neon);animation:fl 1.2s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fin{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@keyframes capt{0%{opacity:0;transform:translateY(8px)}5%,16%{opacity:1;transform:none}20%,100%{opacity:0}}
.sp-bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:#ffffff22;z-index:3}
.sp-bar i{display:block;height:100%;background:linear-gradient(90deg,#fde047,#22d3ee);animation:barw 12.5s linear forwards}

/* ===== Ajakan memutar HP ===== */
#rot{display:none;position:fixed;inset:0;z-index:90;background:var(--bg);place-items:center;padding:14px}
@media (orientation:portrait){#rot:not(.dis){display:grid}}
</style></head>
<body>
<div id="app">
 <header id="top">
  <div class="ttl"><h1>🧬 DNA Rekombinan</h1></div>
  <div id="prog"></div>
  <div id="btns"><button class="ib" id="snd" data-act="snd">🔊</button><button class="ib" data-act="hint">💡</button><button class="ib" data-act="ask">↺</button></div>
 </header>
 <div id="main">
  <div id="stage"><svg id="svg" viewBox="0 0 400 400" class="w-full h-full" preserveAspectRatio="xMidYMid meet"></svg></div>
  <aside id="panel">
   <div id="guide"></div>
   <div id="mis"></div>
   <div id="toast" class="hidden"></div>
   <div id="tray"></div>
  </aside>
 </div>
</div>
<div id="ov"></div>
<div id="splash"></div>
<div id="rot"><div class="box"><div style="font-size:48px">📱↻</div><b class="text-lg">Putar HP ke posisi miring</b><p class="text-sm my-2">Dengan layar lebar, animasi tampil lebih besar dan perintah ada di panel samping sehingga tidak menutupi gambar. Pastikan rotasi otomatis di HP aktif.</p><button class="btn sm ghost" data-act="rotok">Lanjut dalam posisi tegak</button></div></div>
<script>
const $=s=>document.querySelector(s);
const INFO={
plasmid:['Plasmid','Cincin kecil DNA di dalam bakteri. Kita pakai sebagai kurir untuk membawa gen baru.'],
ampR:['Gen kebal antibiotik (ampR)','Membuat bakteri kebal ampisilin. Hanya bakteri yang menerima plasmid yang hidup di media berantibiotik, ini cara menyeleksi.'],
lacZ:['Gen biru (lacZα)','Membuat enzim yang mengubah X-gal menjadi warna biru. Kalau gen ini rusak karena disisipi gen baru, koloni jadi putih.'],
mcs:['Tempat sisip (MCS)','Bagian plasmid dengan banyak tempat potong. Letaknya di tengah gen biru.'],
gene:['Gen target','Gen yang ingin disalin. Kedua ujungnya punya urutan GAATTC, tempat potong EcoRI.'],
ecori:['EcoRI (gunting molekuler)','Memotong hanya di urutan GAATTC dan menghasilkan ujung berumbai yang cocok seperti kepingan puzzle.'],
sticky:['Ujung lengket','Umbai DNA berantai tunggal. A berpasangan dengan T, G dengan C, jadi dua ujung yang cocok menempel seperti velcro.'],
ligase:['DNA ligase','Ibarat lem permanen yang menyambung rangka DNA (ikatan fosfodiester).'],
phospho:['Ikatan fosfodiester','Ikatan kuat pembentuk rangka DNA. Enzim restriksi memutusnya, ligase menyambungnya.'],
hbond:['Ikatan hidrogen','Ikatan lemah antar pasangan basa A-T dan G-C. Menahan potongan agar tidak lepas, tetapi belum permanen.'],
cell:['Bakteri E. coli','Dipakai sebagai pabrik mini. Setelah menerima plasmid rekombinan, bakteri membelah dan menyalin gen baru.'],
white:['Koloni putih ✅','Gen biru rusak karena disisipi gen target, jadi X-gal tidak berubah warna. Putih = rekombinan berhasil!'],
blue:['Koloni biru ❌','Plasmid menutup tanpa gen baru, gen biru masih utuh. Biru = tidak ada gen target.'],
plate:['Cawan agar','Ampisilin meloloskan hanya bakteri yang menerima plasmid. X-gal membedakan koloni berhasil (putih) dan gagal (biru).']};
